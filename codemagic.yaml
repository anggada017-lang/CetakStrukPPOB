workflows:
  android-debug:
    name: CetakStrukPPOB V5 Auto Printer
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Extract V5 project ZIP
        script: |
          set -eu
          rm -rf _project
          mkdir -p _project

          ZIP_FILE="CetakStrukPPOB_v5_AutoPrinter_TokenBesar_SimpanToko.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP V5 tidak ditemukan di root repository."
            exit 1
          fi

          echo "Mengekstrak file V5: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _project

          SETTINGS_FILE="$(find _project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan dalam ZIP V5."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Proyek Android ditemukan: $PROJECT_DIR"
          echo "$PROJECT_DIR" > /tmp/cetakstruk_project_dir.txt

      - name: Build APK
        script: |
          set -eu
          PROJECT_DIR="$(cat /tmp/cetakstruk_project_dir.txt)"
          cd "$PROJECT_DIR"
          java -version
          gradle --version
          gradle assembleDebug

    artifacts:
      - "**/app/build/outputs/apk/debug/*.apk"
